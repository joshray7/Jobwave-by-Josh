<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email — JobWave</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('jw-theme') || 'dark');
  </script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="text-align:center;">
    <div class="auth-logo">
      <div class="logo-mark">JW</div>
      <div class="logo-text">Job<span>Wave</span></div>
    </div>

    <i class="fa-solid fa-envelope-circle-check" style="font-size:40px;color:var(--mint);margin-bottom:16px;"></i>
    <div class="auth-title">Check your email</div>
    <div class="auth-subtitle">We sent a verification link to <strong>{{ current_user.email }}</strong>. Click it to activate your account.</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, msg in messages %}
      <div class="flash {{ category }}" style="margin-top:16px;">{{ msg }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('resend_verification') }}" style="margin-top:20px;">
      <button type="submit" class="btn btn-outline auth-submit">Resend Verification Email</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('logout') }}">Sign out</a>
    </div>
  </div>
</div>
</body>
</html>
