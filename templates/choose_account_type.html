<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started — JobWave</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('jw-theme') || 'dark');
  </script>
  <style>
    .account-type-card {
      display: flex; align-items: center; gap: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      transition: var(--transition);
    }
    .account-type-card i { font-size: 20px; color: var(--text-muted); width: 24px; text-align: center; }
    .type-radio:checked + .account-type-card {
      border-color: var(--mint);
      background: var(--mint-dim);
    }
    .type-radio:checked + .account-type-card i { color: var(--mint); }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">JW</div>
      <div class="logo-text">Job<span>Wave</span></div>
    </div>

    <div class="auth-title">Welcome, {{ current_user.name.split(' ')[0] }}</div>
    <div class="auth-subtitle">What brings you to JobWave?</div>

    <form method="POST" style="margin-top:24px;display:flex;flex-direction:column;gap:12px;">

      <label style="cursor:pointer;">
        <input type="radio" name="account_type" value="user" style="display:none;" class="type-radio">
        <div class="account-type-card" data-type="user">
          <i class="fa-solid fa-magnifying-glass"></i>
          <div>
            <div style="font-weight:700;">I'm looking for a job</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">Search listings, save jobs, track applications</div>
          </div>
        </div>
      </label>

      <label style="cursor:pointer;">
        <input type="radio" name="account_type" value="employer" style="display:none;" class="type-radio">
        <div class="account-type-card" data-type="employer">
          <i class="fa-solid fa-building"></i>
          <div>
            <div style="font-weight:700;">I'm hiring</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">Post job openings and review applicants</div>
          </div>
        </div>
      </label>

      <button type="submit" class="btn btn-mint auth-submit" style="margin-top:8px;">Continue →</button>
    </form>
  </div>
</div>
</body>
</html>
