name: JobWave Cron Triggers

on:
  schedule:
    - cron: '0 23 * * *'   # Scrapers - midnight Lagos
    - cron: '0 11 * * *'   # Scrapers - noon Lagos
    - cron: '0 0 * * *'    # Job expiry - 1am Lagos
    - cron: '0 7 * * *'    # Alerts - 8am Lagos
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine job type
        id: job
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          echo "Triggered by schedule: $SCHEDULE"
          if [ "$SCHEDULE" == "0 23 * * *" ] || [ "$SCHEDULE" == "0 11 * * *" ]; then
            echo "endpoint=run-scrapers" >> $GITHUB_OUTPUT
            echo "keepalive=true" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" == "0 0 * * *" ]; then
            echo "endpoint=expire-jobs" >> $GITHUB_OUTPUT
            echo "keepalive=false" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" == "0 7 * * *" ]; then
            echo "endpoint=run-alerts" >> $GITHUB_OUTPUT
            echo "keepalive=false" >> $GITHUB_OUTPUT
          else
            echo "endpoint=run-scrapers" >> $GITHUB_OUTPUT
            echo "keepalive=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger endpoint
        run: |
          curl -sS "https://jobwave-by-josh.onrender.com/internal/cron/${{ steps.job.outputs.endpoint }}?key=${{ secrets.CRON_SECRET }}"

      - name: Keep app awake during scrape
        if: steps.job.outputs.keepalive == 'true'
        run: |
          for i in $(seq 1 7); do
            sleep 120
            curl -sS "https://jobwave-by-josh.onrender.com/ping" || true
          done
